# Plan B: Cosine LR Annealing (without Sim-DETR)
# Based on config.yml, with Sim-DETR disabled (qgr_enabled=false, lw_glb=0)
# and Cosine LR scheduler enabled.
#
# Verified result: NOT effective for CG-DETR + CASTELLA (-1.78pt vs B-team baseline).
# Kept for documentation and possible future tuning of lr_min.
#
# Usage:
#   python train.py --config config_planB_cosine.yml --resume results_pretraining/best.ckpt

seed: 2023
device: 'cuda'
num_workers: 4
model_name: cg_detr

lr: 0.00005
lr_drop: 100
wd: 0.0001
n_epoch: 100
bsz: 32
eval_bsz: 100
grad_clip: 0.1
max_windows: 10
clip_length: 1
eval_epoch_interval: 1

# Transformer architecture
position_embedding: "sine"
enc_layers: 3
dec_layers: 3
t2v_layers: 2
sent_layers: 1
moment_layers: 1
dummy_layers: 2
dim_feedforward: 1024
hidden_dim: 256
input_dropout: 0.3
dropout: 0.1
nheads: 8
num_queries: 10
n_input_proj: 2

# CG-DETR specific
num_dummies: 45
total_prompts: 10
num_prompts: 2

# Loss weights
saliency_margin: 0.2
span_loss_type: "l1"
set_cost_span: 10
set_cost_giou: 1
set_cost_class: 4
span_loss_coef: 10
giou_loss_coef: 1
label_loss_coef: 4
eos_coef: 0.1
lw_saliency: 1
lw_wattn: 1
lw_ms_align: 1
lw_distill: 1

# Sim-DETR disabled for Plan B
qgr_enabled: false
qgr_beta: 0.1
qgr_sigma: 0.1
lw_glb: 0
glb_tau: 0.07

# Plan B: Cosine LR Annealing
lr_scheduler: cosine
lr_min: 0.000001

# Checkpoint & logging
ckpt_filename: best.ckpt
train_log_filename: train.log
eval_log_filename: val.log
eval_split_name: val
aux_loss: True

# EMA
model_ema: True
ema_decay: 0.999
results_dir: results_planB_cosine

# Dataset: CASTELLA
dset_name: castella
train_path: data/castella_train_release.jsonl
val_path: data/castella_val_release.jsonl
test_path: data/castella_test_release.jsonl
max_q_l: 32
max_a_l: 300

# Features: CLAP (768-dim)
ctx_mode: audio_tef
a_feat_dir: features/castella/clap
t_feat_dir: features/castella/clap_text
a_feat_type: clap
t_feat_type: clap
v_feat_dim: 2
a_feat_dim: 768
t_feat_dim: 768
